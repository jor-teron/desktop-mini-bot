<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; }
    label { display: block; margin: 0.75rem 0 0.25rem; }
    input[type=text] { width: 100%; padding: 0.4rem; }
    .row { margin-top: 1.25rem; display: flex; gap: 0.5rem; }
    button { padding: 0.45rem 0.9rem; }
    #status { margin-top: 1rem; color: #070; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Settings</h1>
  <label for="name">Name</label>
  <input id="name" name="name" type="text" value="desktop-mini-bot" />
  <label><input id="autostart" type="checkbox" /> Autostart</label>
  <div class="row">
    <button id="save" type="button">Save</button>
    <button id="cancel" type="button">Cancel</button>
  </div>
  <p id="status"></p>
  <script>
    document.getElementById('save').onclick = () => {
      document.getElementById('status').textContent = 'Saved!';
    };
    document.getElementById('cancel').onclick = () => {
      document.getElementById('status').textContent = 'Cancelled';
    };
  </script>
</body>
</html>
