[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-mini-bot"
version = "0.2.2"
description = "Lightweight no-vision Linux desktop CUA — Gemini online default, Ollama optional"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jor-teron" }]
# Stdlib only — no pip dependencies.
dependencies = []

[project.scripts]
desktop-mini-bot = "desktop_mini_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["app"]
